<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Production Brief Generator — BAD Marketing</title>
  <link rel="stylesheet" href="styles.css">
  <!-- JSZip + FileSaver via CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
</head>
<body>
  <div class="sticky-top">
    <header class="app-header">
      <div class="brand">
        <h1>Production Brief Generator</h1>
        <span class="subtitle">BAD Marketing</span>
      </div>
      <div class="header-right">
        <div id="client-picker" class="client-picker"></div>
      </div>
    </header>

    <nav id="brief-tabs" class="brief-tabs"></nav>
  </div>

  <main class="form-wrap">
    <section id="overview-section" class="card"></section>
    <section id="creatives-section" class="card"></section>

    <div class="actions">
      <button id="clear-btn" type="button" class="btn-secondary">Clear current brief</button>
      <button id="generate-btn" type="button" class="btn-primary">Generate Brief</button>
    </div>
    <div id="status" role="status" aria-live="polite"></div>
  </main>

  <footer class="app-footer">
    <div class="footer-nav">
      <a href="pm/index.html" class="btn-primary btn-small footer-nav-link">PM Tools (Brief ⇄ Tracker) →</a>
      <a href="strategist/index.html" class="btn-primary btn-small footer-nav-link">Strategist Tools →</a>
      <a href="sop/index.html" class="btn-secondary btn-small footer-nav-link">SOP</a>
    </div>
    <div class="footer-meta">
      Autosaves to your browser. Switch brief types and clients freely — your work persists.
    </div>
  </footer>

  <div id="modal-root"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
